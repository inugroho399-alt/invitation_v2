<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <linearGradient id="mapBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f3f0" />
      <stop offset="100%" stop-color="#ebe9e4" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea4335" />
      <stop offset="100%" stop-color="#c5221f" />
    </linearGradient>
  </defs>

  <!-- Background Base Map -->
  <rect width="600" height="420" fill="url(#mapBg)" />

  <!-- Green Areas / Parks -->
  <path d="M 0,0 L 160,0 L 140,110 L 40,140 L 0,90 Z" fill="#d4edda" opacity="0.8" />
  <path d="M 440,0 L 600,0 L 600,160 L 510,130 L 460,70 Z" fill="#d4edda" opacity="0.7" />
  <path d="M 20,290 L 130,270 L 150,380 L 10,420 L 0,420 L 0,330 Z" fill="#d4edda" opacity="0.75" />
  <path d="M 450,290 L 580,260 L 600,310 L 600,420 L 480,420 Z" fill="#d4edda" opacity="0.6" />

  <!-- River / Water body -->
  <path d="M 370,-10 C 360,90 390,160 370,240 C 350,320 380,380 390,430" fill="none" stroke="#aadaff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 370,-10 C 360,90 390,160 370,240 C 350,320 380,380 390,430" fill="none" stroke="#c4e3fb" stroke-width="18" stroke-linecap="round" />

  <!-- Secondary Roads (Gray) -->
  <g stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -20,70 L 620,110" />
    <path d="M -20,220 L 620,200" />
    <path d="M -20,330 L 620,350" />
    <path d="M 120,-20 L 140,440" />
    <path d="M 270,-20 L 260,440" />
    <path d="M 480,-20 L 490,440" />
    <!-- Diagonal streets -->
    <path d="M 40,390 L 300,50" />
    <path d="M 230,440 L 540,80" />
  </g>

  <!-- Minor Road Details (Inner lines) -->
  <g stroke="#e4e2dc" stroke-width="2" stroke-linecap="round">
    <path d="M -20,70 L 620,110" />
    <path d="M -20,220 L 620,200" />
    <path d="M -20,330 L 620,350" />
    <path d="M 120,-20 L 140,440" />
    <path d="M 270,-20 L 260,440" />
    <path d="M 480,-20 L 490,440" />
  </g>

  <!-- Primary Major Avenues (Yellow / Orange highlight) -->
  <g stroke="#ffeb99" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -20,150 L 620,140" />
    <path d="M 200,-20 C 210,130 190,260 210,440" />
  </g>
  <g stroke="#f9d976" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -20,150 L 620,140" />
    <path d="M 200,-20 C 210,130 190,260 210,440" />
  </g>

  <!-- Road Labels -->
  <text x="50" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#78716c" letter-spacing="0.5">JL. LETJEN SUPRAPTO</text>
  <text x="390" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#78716c" letter-spacing="0.5">JL. AHMAD YANI</text>
  <text x="215" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#8c857b" transform="rotate(82 215 60)">JL. CEMPAKA RAYA</text>
  <text x="45" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#2d6a4f">Taman Kota</text>

  <!-- Top Search Bar Mockup -->
  <g filter="url(#shadow)">
    <rect x="25" y="20" width="550" height="46" rx="23" fill="#ffffff" />
    <!-- Google colored G icon -->
    <g transform="translate(42, 33)">
      <circle cx="10" cy="10" r="10" fill="#ffffff" />
      <path d="M 19 10.1 C 19 9.4 18.9 8.8 18.8 8.2 L 10 8.2 L 10 11.9 L 15.1 11.9 C 14.8 13.2 14 14.3 12.8 15 L 12.8 17.6 L 16 17.6 C 17.8 15.9 19 13.3 19 10.1 Z" fill="#4285F4"/>
      <path d="M 10 19.3 C 12.5 19.3 14.6 18.5 16 17.2 L 12.8 14.6 C 12.1 15.1 11.1 15.4 10 15.4 C 7.6 15.4 5.5 13.8 4.7 11.6 L 1.5 11.6 L 1.5 14.1 C 2.9 17 6.2 19.3 10 19.3 Z" fill="#34A853"/>
      <path d="M 4.7 11.6 C 4.5 11 4.4 10.3 4.4 9.6 C 4.4 8.9 4.5 8.2 4.7 7.6 L 4.7 5.1 L 1.5 5.1 C 0.5 7 0 9.2 0 11.6 C 0 14 0.5 16.2 1.5 18.1 L 4.7 11.6 Z" fill="#FBBC05"/>
      <path d="M 10 3.8 C 11.4 3.8 12.6 4.3 13.6 5.2 L 16.4 2.4 C 14.7 0.9 12.5 0 10 0 C 6.2 0 2.9 2.3 1.5 5.2 L 4.7 7.7 C 5.5 5.4 7.6 3.8 10 3.8 Z" fill="#EA4335"/>
    </g>
    <text x="75" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#3c4043" font-weight="400">Gedung Graha Nusantara</text>
    <!-- Mic & search icons -->
    <circle cx="510" cy="43" r="14" fill="#f1f3f4" />
    <path d="M 508 37 C 508 35.9 508.9 35 510 35 C 511.1 35 512 35.9 512 37 L 512 43 C 512 44.1 511.1 45 510 45 C 508.9 45 508 44.1 508 43 Z" fill="#ea4335" />
    <circle cx="545" cy="43" r="14" fill="#1a73e8" />
    <text x="545" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">D</text>
  </g>

  <!-- Route Line indicator -->
  <path d="M 120,380 C 140,320 200,280 280,245 L 300,215" fill="none" stroke="#4285F4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <circle cx="120" cy="380" r="7" fill="#4285F4" stroke="#ffffff" stroke-width="3" filter="url(#shadow)" />

  <!-- Venue Location Pin -->
  <g transform="translate(300, 160)" filter="url(#pinShadow)">
    <!-- Venue Callout Card -->
    <g transform="translate(-105, -70)">
      <rect width="210" height="52" rx="10" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
      <polygon points="105,52 97,44 113,44" fill="#ffffff" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f">Gedung Graha Nusantara</text>
      <text x="14" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#ea4335">★ 4.8</text>
      <text x="44" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" fill="#70757a">(1.240 ulasan) · Gedung Acara</text>
    </g>
    
    <!-- Red Pin -->
    <path d="M 0,0 C -14,-14 -18,-24 -18,-35 C -18,-47 -8,-56 0,-56 C 8,-56 18,-47 18,-35 C 18,-24 14,-14 0,0 Z" fill="url(#pinGrad)" />
    <circle cx="0" cy="-35" r="7" fill="#8b0000" />
    <circle cx="0" cy="-35" r="5" fill="#ffffff" />
  </g>

  <!-- Floating Navigation Controls on Right -->
  <g transform="translate(540, 100)" filter="url(#shadow)">
    <!-- Layers button -->
    <circle cx="16" cy="16" r="18" fill="#ffffff" />
    <path d="M 16 9 L 24 13 L 16 17 L 8 13 Z M 8 16 L 16 20 L 24 16 M 8 19 L 16 23 L 24 19" fill="none" stroke="#5f6368" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Compass / GPS button -->
    <g transform="translate(0, 50)">
      <circle cx="16" cy="16" r="18" fill="#ffffff" />
      <circle cx="16" cy="16" r="7" fill="none" stroke="#1a73e8" stroke-width="2.5" />
      <line x1="16" y1="5" x2="16" y2="9" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="16" y1="23" x2="16" y2="27" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="5" y1="16" x2="9" y2="16" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="23" y1="16" x2="27" y2="16" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bottom Information Sheet Bar -->
  <g transform="translate(20, 320)" filter="url(#shadow)">
    <rect width="560" height="85" rx="16" fill="#ffffff" />
    
    <!-- Title & Subtitle -->
    <text x="22" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#202124">Gedung Graha Nusantara</text>
    <text x="22" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#5f6368">Jl. Letjen Suprapto No. 80, Solo · Buka</text>
    
    <!-- Action Pills -->
    <g transform="translate(22, 58)">
      <!-- Petunjuk Arah / Directions button -->
      <rect x="0" y="0" width="120" height="20" rx="10" fill="#1a73e8" />
      <path d="M 12 10 L 17 6 L 17 9 L 24 9 L 24 11 L 17 11 L 17 14 Z" fill="#ffffff" />
      <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#ffffff">Petunjuk Arah</text>
      
      <!-- Simpan / Save button -->
      <rect x="130" y="0" width="80" height="20" rx="10" fill="#f1f3f4" />
      <text x="146" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#3c4043">Simpan</text>
      
      <!-- Bagikan / Share button -->
      <rect x="220" y="0" width="80" height="20" rx="10" fill="#f1f3f4" />
      <text x="236" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="500" fill="#3c4043">Bagikan</text>
    </g>
  </g>
</svg>
